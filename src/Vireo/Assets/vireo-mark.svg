<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Vireo's mark: the one drawing behind the app icon, the tab-row mark, the start page and the installer.
       A round teal badge (Vireo's accent) with the bird in Vireo's dark ink; the circle fills the square edge to edge, like
       other apps' round icons, so it reads at the same size in the taskbar. -->
  <defs>
    <linearGradient id="vireo-badge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6FF0D2"/><stop offset="1" stop-color="#23B894"/></linearGradient>
  </defs>
  <circle cx="32" cy="32" r="30.5" fill="url(#vireo-badge)"/>
  <g transform="translate(32 32) scale(0.84) translate(-30.25 -30)">
    <path fill="#04241D" d="M12 36C15 25 25 18 37 19.5C41 14.5 48 12.5 54 14.5C50.5 17.5 49 20.5 49 24C49 37 39 47 25 47C19 47 14 43 12 36Z M13 37L6.5 47.5L19 44Z"/>
    <path fill="#3DDBB9" d="M22 37C27 29.5 36 27.5 43 29.5C40 38 32 43 22 37Z"/>
    <circle cx="44" cy="21" r="2.3" fill="#3DDBB9"/>
  </g>
</svg>
