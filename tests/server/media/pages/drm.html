<!doctype html><html><head><meta charset="utf-8"><title>Protected movie - Media Lab test</title>

<style>body{font-family:system-ui;background:#111;color:#eee;margin:40px}video{max-width:640px;display:block;margin:12px 0}</style>
</head><body><h1>Protected movie - Media Lab test</h1><video id="v" controls></video>
<script>
fetch('/drm/master.m3u8');
(async () => {
  const access = await navigator.requestMediaKeySystemAccess('org.w3.clearkey', [{ initDataTypes: ['cenc'], videoCapabilities: [{ contentType: 'video/mp4; codecs="avc1.42E01E"' }] }]);
  const keys = await access.createMediaKeys();
  await document.getElementById('v').setMediaKeys(keys);
  document.title = document.title + ' ';
})();
</script></body></html>
